name: Integration Workflow

on:
  pull_request:
    branches: [ main, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install npm packages
        run: |
          npm ci

      - name: Run the build
        run: |
          npm run build --if-present

      - name: Test Suites
        run: |
          npm run test:ci
          npm run typecheck
