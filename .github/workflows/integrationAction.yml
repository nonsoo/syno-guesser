name: Integration Workflow

on:
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js v26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Install npm packages
        run: |
          npm ci

      - name: Run the build
        run: |
          npm run build --if-present

      - name: Test Suites
        run: |
          npm run test:ci
          npm run typecheck
